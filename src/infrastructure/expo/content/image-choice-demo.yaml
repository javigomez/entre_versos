id: image-choice-demo-v1
startAction: Empezar el viaje
script:
  - type: mestre
    text: Dos caminos aparecen delante de ti.
  - type: image-choice
    id: viaje-inicial
    mestre: Elige la escena que te llama.
    prompt: ¿Por dónde seguimos?
    options:
      - id: nieve
        text: NIEVE
        image:
          file: nieve.jpg
          description: Sendero nevado hacia un refugio lejano
      - id: playa
        text: PLAYA
        image:
          file: playa.jpg
          description: Camino de dunas frente al mar
completionLabel: Lección completada
completionTitle: Ya hay chispa.
completionSummary: "{COUNT} retos superados. Sigue jugando con tu voz."
restartAction: Volver a entrenar
completion: El viaje acaba de empezar.
