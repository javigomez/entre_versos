  - type: mestre
    kind: prose
    label: Mestre
    text: Vols que t’expliqui com convertir aquest camí en una sortida per rimar?
  - type: student
    action: EXPLICA-M'HO
    text: Vull aprendre el truc.
  - type: mestre
    kind: verse
    label: Mestre
    text: |-
      El viatge obre el camí,
      ara aprendràs a rimar;
      si et llancen un mot difícil,
      tindràs per on escapar.
  - type: mestre
    kind: prose
    label: Mestre
    text: "Díaz-Pimienta classifica com a «infeliç» una paraula amb menys de cinc rimes consonants. No
      cal forçar-la al final del vers: la pots posar a dins i saltar, pel significat, cap a una
      paraula que et deixi una rima més ampla."
  - type: student
    action: PRACTIQUEM
    text: Va, provem com obrir una rima pel significat.
  - type: text-choice
    id: porta-musica
    mestre: Troba una porta pel significat.
    prompt: MÚSICA → ?
    options:
      - id: cantar
        text: CANTAR
      - id: pintar
        text: PINTAR
      - id: nedar
        text: NEDAR
      - id: tancar
        text: TANCAR
    correctOptionId: cantar
    success: CANTAR. Has saltat a una acció del mateix món.
    retry: Busca un verb en -AR relacionat directament amb MÚSICA.
  - type: text-choice
    id: porta-silenci
    mestre: Mantén el mateix criteri.
    prompt: SILENCI → ?
    options:
      - id: callar
        text: CALLAR
      - id: remar
        text: REMAR
      - id: pentinar
        text: PENTINAR
      - id: saltar
        text: SALTAR
    correctOptionId: callar
    success: CALLAR. El significat et dona una sortida nova.
    retry: Busca l'acció que expressa directament SILENCI.
  - type: text-choice
    id: porta-llum
    mestre: Busca l'acció més directa.
    prompt: LLUM → ?
    options:
      - id: brillar
        text: BRILLAR
      - id: remar
        text: REMAR
      - id: cuinar
        text: CUINAR
      - id: grimpar
        text: GRIMPAR
    correctOptionId: brillar
    success: BRILLAR. Primer has seguit el significat.
    retry: Quina acció associes de manera directa amb LLUM?
  - type: text-choice
    id: porta-foc
    mestre: Una última associació directa.
    prompt: FOC → ?
    options:
      - id: cremar
        text: CREMAR
      - id: nedar
        text: NEDAR
      - id: pentinar
        text: PENTINAR
      - id: remar
        text: REMAR
    correctOptionId: cremar
    success: CREMAR. Camp semàntic primer; rima fàcil després.
    retry: Quina acció pertany clarament al món del FOC?
  - type: text-choice
    id: sortida-musica
    mestre: Ara totes pertanyen al mateix camp.
    prompt: Quina et prepara una rima en -AR?
    options:
      - id: cantar-facil
        text: CANTAR
      - id: ritme
        text: RITME
      - id: acord
        text: ACORD
      - id: solfeig
        text: SOLFEIG
    correctOptionId: cantar-facil
    success: CANTAR. Totes hi tenen relació, però aquesta ja obre la rima en -AR.
    retry: Ara busca significat i també la terminació -AR.
  - type: text-choice
    id: sortida-silenci
    mestre: Tria significat i una terminació ampla.
    prompt: Quina et dona una sortida directa en -AR?
