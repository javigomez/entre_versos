id: camp-semantic-viatge-v4
startAction: AIXECAR-ME
startWithStudent: true
script:
  - type: mestre
    label: Veu
    text: |-
      La batalla s'ha acabat.
      T'has quedat sense resposta.
      El rival ja t'ha guanyat.
      Posar-te dret també costa.
    kind: verse
  - type: student
    action: AIXECAR-ME
    text: No m'ha tocat ningú. M'he quedat en blanc i no he sabut què dir.
  - type: mestre
    label: Veu
    text: |-
      Trobes una simple nota,
      a terra, al teu costat;
      parla d’aquella derrota,
      però... qui te l’ha deixat?
    kind: verse
  - type: student
    action: LLEGIR LA NOTA
    text: "Desplego el paper. Hi diu: «Vols saber per què has perdut? Vine a trobar-me». Signat: Mestre"
  - type: mestre
    label: Nota
    text: |-
      Vols saber com has perdut,
      vine a trobar-me, valent;
      tria el camí al teu gust
      i deixa’t portar pel vent.
    kind: verse
  - type: student
    action: COMENÇAR EL VIATGE
    text: D'acord. Trio una imatge i vaig seguint el que em vingui al cap.
  - type: image-journey
    id: viaje-palabras
    startNodeId: l1-viaje
    revelation: |-
      No sabies què triar,
      i has anat trobant sortides;
      ara et ve de gust {VERBO},
      les paraules van seguides.
    teaching: "Has començat amb una imatge i has anat trobant un camí. Les paraules es poden relacionar
      pel significat: platja, sorra i mar, per exemple, comparteixen un mateix entorn. Aquestes
      relacions formen camps semàntics i et donen una paraula nova quan et quedes en blanc."
