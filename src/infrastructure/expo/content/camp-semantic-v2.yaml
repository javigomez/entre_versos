# Adaptació alternativa 2. Mateixes imatges i decisions; progrés independent.
id: camp-semantic-viatge-v2
startAction: AIXECAR-ME
startWithStudent: true
script:
  - type: mestre
    label: Veu
    text: |-
      La batalla s'ha acabat.
      T'has quedat sense resposta.
      El rival ja t'ha guanyat.
      Posar-te dret també costa.
  - type: student
    action: AIXECAR-ME
    text: No m'ha tocat ningú. M'he quedat en blanc i no he sabut què dir.
  - type: mestre
    label: Veu
    text: |-
      Ja no hi queda ningú.
      El paper està plegat.
      Una nota. Va per tu.
      No saps qui te l'ha deixat.
  - type: student
    action: LLEGIR LA NOTA
    text: "Desplego el paper. Hi diu: «Vols saber per què has perdut? Vine a trobar-me»."
  - type: mestre
    label: Nota
    text: Aquí no hi ha cap resposta correcta. Mira les dues imatges, tria la que et vingui de gust i continua.
  - type: student
    action: COMENÇAR EL VIATGE
    text: D'acord. Trio una imatge i vaig seguint el que em vingui al cap.
  - type: image-journey
    id: viaje-palabras
    startNodeId: l1-viaje
    revelation: |-
      Has triat sense pensar,
      tot seguint les teves ganes;
      i has acabat per {VERBO},
      enllaçant noves paraules.
    teaching: >-
      Has vist com una paraula et porta a una altra? La neu et pot fer pensar en el fred, i el fred, en un
      refugi. Quan les paraules tenen significats relacionats, formen un camp semàntic. Pel camí pots passar d'un
      camp a un altre. No cal que les paraules rimin.


      A la batalla t'has quedat encallat buscant què dir. Si et torna a passar, prova de seguir la primera
      idea que et vingui al cap. Et pot portar a la següent.
